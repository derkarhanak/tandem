[package]
name = "tandem"
version = "0.1.0"
edition = "2024"
description = "Simple, light folder sync for your computer, built on Syncthing's engine"
license = "MPL-2.0"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
ureq = { version = "3.5", default-features = false, features = ["json"] }
serde_json = "1"
roxmltree = "0.21"
qrcode = { version = "0.14", default-features = false }
rfd = "0.18"
# Load fontconfig at runtime, so building needs no fontconfig -devel package.
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
